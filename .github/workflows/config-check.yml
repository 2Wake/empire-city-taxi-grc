name: Monthly configuration check

# Read-only check of the cloud project and repository settings against the policies (GOV-159).
# Writes data-platform/config-checks/<date>.md and commits it as evidence. Findings are recorded, not fixed;
# the run fails when there is a finding, so GitHub emails the maintainer. Setup: docs/github-actions-setup.md, part L.
on:
  schedule:
    - cron: "17 13 1 * *"   # 1st of each month, 08:17 New York (09:17 in summer)
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v4
      - name: Sign in as the log reader (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_MONITOR_SERVICE_ACCOUNT }}
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen
      - name: Check settings (read-only)
        id: check
        env:
          ECT_MAINTAINER_PRINCIPAL: ${{ secrets.ECT_MAINTAINER_PRINCIPAL }}
        run: uv run ect-config-check
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config-checks/
          git commit -m "Configuration check $(date -u +%F)" || exit 0
          git pull --rebase origin main
          git push
      - name: Fail the run if there are findings
        run: uv run ect-config-check --check > /dev/null
