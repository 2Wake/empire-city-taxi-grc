version: 2

# Marts: what analysts and dashboards use. Capped at Sensitive (Data Classification Standard):
# no Secret columns; Confidential columns are excluded, masked or generalized.
# tests/assert_marts_classification_cap.sql enforces this on every build.

models:
  - name: dim_employees
    description: "Current employees (drivers included). Sensitive: names and work email. SSN, salary and performance rating are excluded."
    config: {labels: {domain: people, layer: marts, data_owner: vp-people, data_steward: hr-data-steward, classification: sensitive, source_system: hris, data_origin: synthetic, contains_pii: "true", pci_scope: "false", retention: 7y}}
    columns:
      - name: employee_id
        data_tests: [unique, not_null]
  - name: dim_drivers
    description: "Current drivers. Sensitive: names. Identity, contact, licence, background-check and bank details are excluded."
    config: {labels: {domain: driver, layer: marts, data_owner: vp-driver-operations, data_steward: driver-data-steward, classification: sensitive, source_system: fleet, data_origin: synthetic, contains_pii: "true", pci_scope: "false", retention: 7y}}
    columns:
      - name: driver_id
        data_tests: [unique, not_null]
      - name: employee_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_employees'), field: employee_id}}
  - name: dim_riders
    description: "Current rider accounts. Sensitive: names. Email, phone and address are excluded."
    config: {labels: {domain: rider, layer: marts, data_owner: vp-rider-experience, data_steward: rider-data-steward, classification: sensitive, source_system: app, data_origin: synthetic, contains_pii: "true", pci_scope: "false", retention: 3y}}
    columns:
      - name: rider_id
        data_tests: [unique, not_null]
  - name: dim_rider_cards
    description: "Rider payment cards, masked to the last 4 digits. No cardholder data, so the table is out of PCI scope."
    config: {labels: {domain: finance, layer: marts, data_owner: cfo, data_steward: finance-data-steward, classification: sensitive, source_system: payments, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: 3y}}
    columns:
      - name: card_id
        data_tests: [unique, not_null]
      - name: rider_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_riders'), field: rider_id}}
  - name: dim_taxi_zones
    description: "NYC taxi zones, one row per zone: the public table de-duplicated, plus zones it is missing (zone_source = supplement)."
    config: {labels: {domain: reference, layer: marts, data_owner: data-governance-manager, data_steward: ops-data-steward, classification: public, source_system: tlc, data_origin: public, contains_pii: "false", pci_scope: "false", retention: indefinite}}
    columns:
      - name: zone_id
        data_tests: [unique, not_null]
  - name: fct_trips
    description: "Completed trips. Pickup and dropoff are generalized to borough, because exact zones plus rider_id would be Confidential."
    config: {labels: {domain: trips, layer: marts, data_owner: vp-operations, data_steward: ops-data-steward, classification: sensitive, source_system: derived, data_origin: synthetic, contains_pii: "true", pci_scope: "false", retention: 7y}}
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: driver_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_drivers'), field: driver_id}}
      - name: pickup_borough
        data_tests:
          - not_null:
              config: {severity: warn}
  - name: fct_daily_zone_trips
    description: "Trips and revenue per pickup zone per day. Aggregated: no rider or driver IDs."
    config: {labels: {domain: trips, layer: marts, data_owner: vp-operations, data_steward: ops-data-steward, classification: sensitive, source_system: derived, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: 7y}}
  - name: fct_trip_surveys
    description: "Post-trip surveys. Comments are masked: phone numbers and emails become [REDACTED]."
    config: {labels: {domain: rider, layer: marts, data_owner: vp-rider-experience, data_steward: rider-data-steward, classification: sensitive, source_system: app, data_origin: synthetic, contains_pii: "true", pci_scope: "false", retention: 3y}}
    columns:
      - name: survey_id
        data_tests: [unique, not_null]
  - name: fct_ledger_entries
    description: "General ledger postings by month and account."
    config: {labels: {domain: finance, layer: marts, data_owner: cfo, data_steward: finance-data-steward, classification: sensitive, source_system: payments, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: 7y}}
    columns:
      - name: entry_id
        data_tests: [unique, not_null]
  - name: dim_campaigns
    description: "Marketing campaigns."
    config: {labels: {domain: marketing, layer: marts, data_owner: vp-marketing, data_steward: marketing-data-steward, classification: sensitive, source_system: app, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: 3y}}
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
  - name: dim_rider_segments
    description: "Rider marketing segments and their current size estimates."
    config: {labels: {domain: marketing, layer: marts, data_owner: vp-marketing, data_steward: marketing-data-steward, classification: internal, source_system: app, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: 3y}}
    columns:
      - name: segment_id
        data_tests: [unique, not_null]
  - name: dim_dq_rules
    description: "The data-quality rule catalog (from the dq_rules seed)."
    config: {labels: {domain: governance, layer: marts, data_owner: data-governance-manager, data_steward: data-governance-manager, classification: internal, source_system: derived, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}}
    columns:
      - name: rule_id
        data_tests: [unique, not_null]
  - name: fct_dq_findings
    description: >
      Every record that fails a data-quality rule (one row per rule and record). Record IDs
      only, never the failing values. Built from the data alone; never reads the answer key.
    config: {labels: {domain: governance, layer: marts, data_owner: data-governance-manager, data_steward: data-governance-manager, classification: internal, source_system: derived, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}}
    data_tests:
      - rule_has_no_findings:
          name: dq_01_app_riders_email
          arguments: {rule_id: DQ-01}
          config: {severity: warn, meta: {rule_id: DQ-01, dimension: Completeness, origin: planted}}
      - rule_has_no_findings:
          name: dq_02_app_riders_email
          arguments: {rule_id: DQ-02}
          config: {severity: warn, meta: {rule_id: DQ-02, dimension: Validity, origin: planted}}
      - rule_has_no_findings:
          name: dq_03_app_riders_email
          arguments: {rule_id: DQ-03}
          config: {severity: warn, meta: {rule_id: DQ-03, dimension: Uniqueness, origin: planted}}
      - rule_has_no_findings:
          name: dq_04_fleet_drivers_ssn_last4
          arguments: {rule_id: DQ-04}
          config: {severity: warn, meta: {rule_id: DQ-04, dimension: Validity, origin: planted}}
      - rule_has_no_findings:
          name: dq_05_fleet_drivers_tlc_license
          arguments: {rule_id: DQ-05}
          config: {severity: warn, meta: {rule_id: DQ-05, dimension: Completeness, origin: planted}}
      - rule_has_no_findings:
          name: dq_06_fleet_drivers_background_check_status
          arguments: {rule_id: DQ-06}
          config: {severity: warn, meta: {rule_id: DQ-06, dimension: Consistency, origin: planted}}
      - rule_has_no_findings:
          name: dq_07_payments_rider_cards_card_last4
          arguments: {rule_id: DQ-07}
          config: {severity: warn, meta: {rule_id: DQ-07, dimension: Validity, origin: planted}}
      - rule_has_no_findings:
          name: dq_08_app_trip_surveys_rating
          arguments: {rule_id: DQ-08}
          config: {severity: warn, meta: {rule_id: DQ-08, dimension: Validity, origin: planted}}
      - rule_has_no_findings:
          name: dq_09_app_trip_surveys_trip_id
          arguments: {rule_id: DQ-09}
          config: {severity: warn, meta: {rule_id: DQ-09, dimension: Integrity, origin: planted}}
      - rule_has_no_findings:
          name: dq_10_app_trip_surveys_comment
          arguments: {rule_id: DQ-10}
          config: {severity: warn, meta: {rule_id: DQ-10, dimension: Privacy, origin: planted}}
      - rule_has_no_findings:
          name: dq_11_hris_employees_salary
          arguments: {rule_id: DQ-11}
          config: {severity: warn, meta: {rule_id: DQ-11, dimension: Validity, origin: planted}}
      - rule_has_no_findings:
          name: dq_12_app_marketing_campaigns_end_date
          arguments: {rule_id: DQ-12}
          config: {severity: warn, meta: {rule_id: DQ-12, dimension: Validity, origin: planted}}
      - rule_has_no_findings:
          name: dq_13_hris_employees_ssn_last4
          arguments: {rule_id: DQ-13}
          config: {severity: warn, meta: {rule_id: DQ-13, dimension: Validity, origin: planted}}
      - rule_has_no_findings:
          name: dq_14_hris_employees_email
          arguments: {rule_id: DQ-14}
          config: {severity: warn, meta: {rule_id: DQ-14, dimension: Uniqueness, origin: planted}}
      - rule_has_no_findings:
          name: dq_15_payments_financial_ledger_account
          arguments: {rule_id: DQ-15}
          config: {severity: warn, meta: {rule_id: DQ-15, dimension: Completeness, origin: planted}}
      - rule_has_no_findings:
          name: dq_16_fleet_drivers_payout_account_last4
          arguments: {rule_id: DQ-16}
          config: {severity: warn, meta: {rule_id: DQ-16, dimension: Validity, origin: planted}}
      - rule_has_no_findings:
          name: t1_app_trips_fare_amount
          arguments: {rule_id: T1}
          config: {severity: warn, meta: {rule_id: T1, dimension: Validity, origin: real}}
      - rule_has_no_findings:
          name: t2_app_trips_passenger_count
          arguments: {rule_id: T2}
          config: {severity: warn, meta: {rule_id: T2, dimension: Validity, origin: real}}
      - rule_has_no_findings:
          name: t3_app_trips_trip_distance
          arguments: {rule_id: T3}
          config: {severity: warn, meta: {rule_id: T3, dimension: Validity, origin: real}}
      - rule_has_no_findings:
          name: t4_app_trips_dropoff_datetime
          arguments: {rule_id: T4}
          config: {severity: warn, meta: {rule_id: T4, dimension: Consistency, origin: real}}
      - rule_has_no_findings:
          name: ref_01_tlc_taxi_zones_zone_id
          arguments: {rule_id: REF-01}
          config: {severity: warn, meta: {rule_id: REF-01, dimension: Uniqueness, origin: real}}
      - rule_has_no_findings:
          name: ref_02_app_trips_pickup_location_id
          arguments: {rule_id: REF-02}
          config: {severity: warn, meta: {rule_id: REF-02, dimension: Integrity, origin: real}}
      - rule_has_no_findings:
          name: ref_03_app_trips_dropoff_location_id
          arguments: {rule_id: REF-03}
          config: {severity: warn, meta: {rule_id: REF-03, dimension: Integrity, origin: real}}
      - rule_has_no_findings:
          name: acc_01_iam_access_grants_dataset
          arguments: {rule_id: ACC-01}
          config: {severity: warn, meta: {rule_id: ACC-01, dimension: Access, origin: planted}}
      - rule_has_no_findings:
          name: acc_02_iam_access_grants_not_revoked_on_termination
          arguments: {rule_id: ACC-02}
          config: {severity: warn, meta: {rule_id: ACC-02, dimension: Access, origin: planted}}
      - rule_has_no_findings:
          name: acc_03_iam_access_grants_retained_after_transfer
          arguments: {rule_id: ACC-03}
          config: {severity: warn, meta: {rule_id: ACC-03, dimension: Access, origin: planted}}
      - rule_has_no_findings:
          name: acc_04_iam_access_grants_self_approved
          arguments: {rule_id: ACC-04}
          config: {severity: warn, meta: {rule_id: ACC-04, dimension: Access, origin: planted}}
      - rule_has_no_findings:
          name: acc_05_iam_access_grants_expired_still_active
          arguments: {rule_id: ACC-05}
          config: {severity: warn, meta: {rule_id: ACC-05, dimension: Access, origin: planted}}
      - rule_has_no_findings:
          name: acc_06_iam_access_grants_missing_approval
          arguments: {rule_id: ACC-06}
          config: {severity: warn, meta: {rule_id: ACC-06, dimension: Access, origin: planted}}
      - rule_has_no_findings:
          name: acc_07_iam_access_grants_wrong_approver
          arguments: {rule_id: ACC-07}
          config: {severity: warn, meta: {rule_id: ACC-07, dimension: Access, origin: planted}}
      - rule_has_no_findings:
          name: hr_01_active_driver_without_cleared_check
          arguments: {rule_id: HR-01}
          config: {severity: warn, meta: {rule_id: HR-01, dimension: Compliance, origin: planted}}
      - rule_has_no_findings:
          name: hr_02_sensitive_access_without_screening
          arguments: {rule_id: HR-02}
          config: {severity: warn, meta: {rule_id: HR-02, dimension: Compliance, origin: control}}
      - rule_has_no_findings:
          name: hr_03_no_confidentiality_terms
          arguments: {rule_id: HR-03}
          config: {severity: warn, meta: {rule_id: HR-03, dimension: Compliance, origin: control}}
      - rule_has_no_findings:
          name: pci_01_terminal_inspection_overdue
          arguments: {rule_id: PCI-01}
          config: {severity: warn, meta: {rule_id: PCI-01, dimension: Compliance, origin: control}}
      - rule_has_no_findings:
          name: pci_02_unapproved_payment_page_script
          arguments: {rule_id: PCI-02}
          config: {severity: warn, meta: {rule_id: PCI-02, dimension: Compliance, origin: control}}
      - rule_has_no_findings:
          name: pci_03_payment_page_change_check_late
          arguments: {rule_id: PCI-03}
          config: {severity: warn, meta: {rule_id: PCI-03, dimension: Compliance, origin: control}}
      - rule_has_no_findings:
          name: hr_04_training_overdue_over_30_days
          arguments: {rule_id: HR-04}
          config: {severity: warn, meta: {rule_id: HR-04, dimension: Compliance, origin: control}}
  - name: fct_compliance_findings_daily
    description: >
      History of compliance findings (ACC, HR, PCI, CLS), one row per finding per day seen (incremental,
      one partition per run date). Feeds fct_findings_tracker (GOV-111).
    config: {labels: {domain: governance, layer: marts, data_owner: data-governance-manager, data_steward: data-governance-manager, classification: internal, source_system: derived, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}}
  - name: fct_findings_tracker
    description: >
      Every compliance finding with its owner, steward, action, first seen, due date and status (open,
      overdue, resolved). Routing from the finding_routing seed; classification findings go to the column's
      own owner and steward. POL-02 st. 19, POL-03 compliance st. 1-2 (GOV-111).
    config: {labels: {domain: governance, layer: marts, data_owner: data-governance-manager, data_steward: data-governance-manager, classification: internal, source_system: derived, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}}
    columns:
      - name: finding_key
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values: {arguments: {values: ['open', 'overdue', 'resolved']}}
  - name: fct_policy_review_status
    description: >
      Monthly overdue-review check of the Policy Register (STD-01 section 9; GOV-112): each document's next
      review date and whether the review is overdue, due within 60 days, current, or not yet approved.
    config: {labels: {domain: governance, layer: marts, data_owner: ciso, data_steward: data-governance-manager, classification: internal, source_system: derived, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}}
    columns:
      - name: doc_id
        data_tests: [unique, not_null]
      - name: review_status
        data_tests:
          - accepted_values: {arguments: {values: ['overdue', 'due_within_60_days', 'current', 'not_approved']}}
  - name: fct_training_completions
    description: >
      SIMULATED training. One row per active employee per required security training course (POL-14
      section 5.3; GOV-110): TRN-01 staff, TRN-02 drivers, TRN-03 staff with raw or staging access. Due by
      2027-02-24 for staff employed when the courses opened, 10 business days after starting for later
      hires, and on the day of access for new TRN-03 assignments. Status, days overdue and who the case
      is escalated to (manager and VP People; the CISO after 30 days, decision 2(b)). Repeats yearly.
    config: {labels: {domain: people, layer: marts, data_owner: vp-people, data_steward: hr-data-steward, classification: internal, source_system: derived, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}}
    columns:
      - name: training_key
        data_tests: [unique, not_null]
      - name: course_id
        data_tests:
          - accepted_values: {arguments: {values: ['TRN-01', 'TRN-02', 'TRN-03']}}
      - name: training_status
        data_tests:
          - accepted_values: {arguments: {values: ['pending', 'completed', 'overdue', 'expired']}}
  - name: fct_policy_acknowledgments
    description: >
      SIMULATED acknowledgments. One row per active employee (drivers included) per approved policy
      version, plus DOC-04 Electronic Monitoring Notice: when it was assigned, when it is due (10 business days after the later of approval
      and hire; POL-01 statement 6, STD-01 section 11), whether and when it was acknowledged, and
      the evidence. Derived daily from the Policy Register and HR, so new hires and leavers flow in
      automatically. Each acknowledgment counts for 12 months (next_due_on); after that the row is
      'expired' until acknowledged again (yearly cycle, POL-01 st. 6, GOV-107). Acknowledgments received come from the policy_acknowledgments seed and, from
      2026-11-28, HR's acknowledgment feed (stg_hris_policy_acknowledgments, simulated); the earliest counts.
    config: {labels: {domain: governance, layer: marts, data_owner: ciso, data_steward: data-governance-manager, classification: internal, source_system: derived, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}}
    columns:
      - name: ack_key
        description: "employee_id|doc_id|major_version: one row per employee per major policy version (a minor revision keeps earlier acknowledgments, POL-01 statement 6)."
        data_tests: [unique, not_null]
      - name: employee_id
        description: Employee ID (no names).
        data_tests: [not_null]
      - name: department
        description: Employee's department, for reporting by team.
      - name: doc_id
        description: Document ID from the Policy Register (POL-01 to POL-15, and DOC-04).
        data_tests: [not_null]
      - name: doc_version
        description: Approved version that must be acknowledged.
        data_tests: [not_null]
      - name: major_version
        description: "Major part of the current version (e.g. 1 for 1.1). Acknowledgments match on this."
      - name: assigned_on
        description: Later of the policy's approval date and the employee's hire date.
        data_tests: [not_null]
      - name: due_on
        description: The later of 10 business days (Mon-Fri) after assigned_on and any deadline announced to staff (policy_ack_deadlines seed). Public holidays are not skipped.
        data_tests: [not_null]
      - name: acknowledged_on
        description: Date acknowledged, from the policy_acknowledgments seed. Blank if not yet.
      - name: evidence
        description: Where the acknowledgment is shown (e.g. a Confluence comment ID).
      - name: ack_status
        description: acknowledged, pending (not yet due), overdue (past due_on, not acknowledged) or expired (acknowledged more than 12 months ago; yearly cycle).
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [acknowledged, pending, overdue, expired]}
      - name: on_time
        description: True when acknowledged on or before due_on.

  - name: fct_dq_scorecard
    description: >
      One row per data-quality rule: failing records, and for planted defects how many the rule
      caught or missed against the answer key. The only model that reads the answer key.
    config: {labels: {domain: governance, layer: marts, data_owner: data-governance-manager, data_steward: data-governance-manager, classification: internal, source_system: derived, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}}
    columns:
      - name: rule_id
        data_tests: [unique, not_null]
    data_tests:
      # Control test on the checks themselves: a missed planted defect means a rule is broken.
      - expression_is_true:
          name: scorecard_every_planted_defect_caught
          arguments: {expression: "planted_missed = 0"}

  - name: fct_classification_findings
    description: "Problems found in the column classification register (rules CLS-01 to CLS-08). Uses the register and BigQuery metadata only; never the answer key."
    config: {labels: {domain: governance, layer: marts, data_owner: data-governance-manager, data_steward: data-governance-manager, classification: internal, source_system: derived, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}}
    data_tests:
      - rule_has_no_findings:
          name: cls_01_column_not_classified
          arguments: {rule_id: CLS-01}
          config: {severity: warn, meta: {rule_id: CLS-01, dimension: Metadata}}
      - rule_has_no_findings:
          name: cls_02_register_entry_without_column
          arguments: {rule_id: CLS-02}
          config: {severity: warn, meta: {rule_id: CLS-02, dimension: Metadata}}
      - rule_has_no_findings:
          name: cls_03_classification_not_approved
          arguments: {rule_id: CLS-03}
          config: {severity: warn, meta: {rule_id: CLS-03, dimension: Metadata}}
      - rule_has_no_findings:
          name: cls_04_table_label_inconsistent
          arguments: {rule_id: CLS-04}
          config: {severity: warn, meta: {rule_id: CLS-04, dimension: Metadata}}
      - rule_has_no_findings:
          name: cls_05_lineage_drift
          arguments: {rule_id: CLS-05}
          config: {severity: warn, meta: {rule_id: CLS-05, dimension: Metadata}}
      - rule_has_no_findings:
          name: cls_06_above_marts_cap
          arguments: {rule_id: CLS-06}
          config: {severity: warn, meta: {rule_id: CLS-06, dimension: Metadata}}
      - rule_has_no_findings:
          name: cls_07_steward_mismatch
          arguments: {rule_id: CLS-07}
          config: {severity: warn, meta: {rule_id: CLS-07, dimension: Metadata}}
      - rule_has_no_findings:
          name: cls_08_invalid_classification_value
          arguments: {rule_id: CLS-08}
          config: {severity: warn, meta: {rule_id: CLS-08, dimension: Metadata}}
  - name: fct_classification_scorecard
    description: "Register vs. answer key for every column: correct, under-classified, over-classified, missing or invalid, and which check (if any) flagged it. The only model that reads the classification answer key."
    config: {labels: {domain: governance, layer: marts, data_owner: data-governance-manager, data_steward: data-governance-manager, classification: internal, source_system: derived, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}}
  - name: fct_access_grants
    description: "Current warehouse access with employee and approver names, for user access reviews. Sensitive: names and entitlements."
    config: {labels: {domain: risk, layer: marts, data_owner: ciso, data_steward: risk-data-steward, classification: sensitive, source_system: derived, data_origin: synthetic, contains_pii: "true", pci_scope: "false", retention: 3y}}
    columns:
      - name: grant_id
        data_tests: [unique, not_null]
  - name: dim_access_policy
    description: "The access policy matrix (from the access_policy seed)."
    config: {labels: {domain: risk, layer: marts, data_owner: ciso, data_steward: risk-data-steward, classification: internal, source_system: governance, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}}
  - name: fct_role_access_tests
    description: "Latest access check of each real role service account, by dataset and method (config = control design, enforcement = operating effectiveness), judged against the access policy."
    config: {labels: {domain: risk, layer: marts, data_owner: ciso, data_steward: risk-data-steward, classification: internal, source_system: derived, data_origin: observed, contains_pii: "false", pci_scope: "false", retention: 3y}}
    data_tests:
      - rule_has_no_findings:
          name: acc_08_role_account_excess_access
          arguments: {rule_id: ACC-08}
          config: {severity: warn, meta: {rule_id: ACC-08, dimension: Access, origin: observed}}
      - rule_has_no_findings:
          name: acc_09_role_account_missing_access
          arguments: {rule_id: ACC-09}
          config: {severity: warn, meta: {rule_id: ACC-09, dimension: Access, origin: observed}}
      - rule_has_no_findings:
          name: acc_10_role_account_check_failed
          arguments: {rule_id: ACC-10}
          config: {severity: warn, meta: {rule_id: ACC-10, dimension: Access, origin: observed}}
  - name: fct_role_access_scorecard
    description: "Planted role-account misconfigurations (answer key) vs. what the config and enforcement checks caught, plus any unplanted failures."
    config: {labels: {domain: risk, layer: marts, data_owner: ciso, data_steward: risk-data-steward, classification: internal, source_system: derived, data_origin: observed, contains_pii: "false", pci_scope: "false", retention: 3y}}
