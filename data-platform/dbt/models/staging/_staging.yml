version: 2

# Labels per the Labeling Standard (01-governance-program/governance/labeling-standard.md).
# Each label set is written out once (&name) and reused below (*name).
# Staging keeps raw values as they are, defects included. The data-quality rules run in
# marts/governance/fct_dq_findings (one place for all rule logic); only structural tests live here.

models:
  # ---------------------------------------------------------------- people
  - name: stg_hris_employees
    description: Current version of each employee record in the HR system (drivers included).
    config: {labels: &people {domain: people, layer: staging, data_owner: vp-people, data_steward: hr-data-steward, classification: confidential, source_system: hris, data_origin: synthetic, contains_pii: "true", pci_scope: "false", retention: 7y}}
    columns:
      - name: employee_id
        data_tests: [unique, not_null]

  - name: stg_hris_employees_history
    description: Every version of every employee record, with valid_from / valid_to / is_current.
    config: {labels: *people}

  - name: stg_hris_policy_acknowledgments
    description: >
      SIMULATED. Policy acknowledgments collected by HR, from generator 0.5.0 (2026-11-28 onward): one row
      per employee per document. Staff acknowledge by commenting on Confluence blog 950312, drivers in the
      ECT Driver app; one action covers all 15 policies and DOC-04. acknowledged_on is the New York date.
    config: {labels: {domain: people, layer: staging, data_owner: vp-people, data_steward: hr-data-steward, classification: internal, source_system: hris, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: 7y}}
    columns:
      - name: ack_id
        data_tests: [unique, not_null]
      - name: employee_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_hris_employees'), field: employee_id}}
      - name: doc_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('policy_register'), field: doc_id}}
      - name: channel
        data_tests:
          - accepted_values: {arguments: {values: ['confluence_comment', 'driver_app']}}

  - name: stg_hris_training_completions
    description: >
      SIMULATED. Security awareness training completions from the Confluence course (generator 0.6.0,
      courses open 2026-12-01): one row per passed quiz. completed_on is the New York date.
    config: {labels: {domain: people, layer: staging, data_owner: vp-people, data_steward: hr-data-steward, classification: internal, source_system: hris, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: 7y}}
    columns:
      - name: completion_id
        data_tests: [unique, not_null]
      - name: employee_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_hris_employees'), field: employee_id}}
      - name: course_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('training_courses'), field: course_id}}

  # ---------------------------------------------------------------- driver
  - name: stg_fleet_drivers
    description: Current version of each driver record in the fleet system.
    config: {labels: &driver {domain: driver, layer: staging, data_owner: vp-driver-operations, data_steward: driver-data-steward, classification: confidential, source_system: fleet, data_origin: synthetic, contains_pii: "true", pci_scope: "false", retention: 7y}}
    columns:
      - name: driver_id
        data_tests: [unique, not_null]
      - name: employee_id
        data_tests:
          - relationships: {arguments: {to: ref('stg_hris_employees'), field: employee_id}}

  - name: stg_fleet_drivers_history
    description: Every version of every driver record, with valid_from / valid_to / is_current.
    config: {labels: *driver}

  # ---------------------------------------------------------------- rider
  - name: stg_app_riders
    description: Current version of each rider account in the rider app.
    config: {labels: &rider {domain: rider, layer: staging, data_owner: vp-rider-experience, data_steward: rider-data-steward, classification: confidential, source_system: app, data_origin: synthetic, contains_pii: "true", pci_scope: "false", retention: 3y}}
    columns:
      - name: rider_id
        data_tests: [unique, not_null]

  - name: stg_app_riders_history
    description: Every version of every rider account, with valid_from / valid_to / is_current.
    config: {labels: *rider}

  - name: stg_app_trip_surveys
    description: Post-trip surveys (immutable; one row per survey).
    config: {labels: *rider}
    columns:
      - name: survey_id
        data_tests: [unique, not_null]

  # ---------------------------------------------------------------- finance
  - name: stg_payments_rider_cards
    description: Current version of each rider payment card. PCI scope.
    config: {labels: &cards {domain: finance, layer: staging, data_owner: cfo, data_steward: finance-data-steward, classification: secret, source_system: payments, data_origin: synthetic, contains_pii: "true", pci_scope: "true", retention: 3y}}
    columns:
      - name: card_id
        data_tests: [unique, not_null]
      - name: rider_id
        data_tests:
          - relationships: {arguments: {to: ref('stg_app_riders'), field: rider_id}}

  - name: stg_payments_rider_cards_history
    description: Every version of every card record, with valid_from / valid_to / is_current.
    config: {labels: *cards}

  - name: stg_payments_financial_ledger
    description: General ledger postings, latest version of each entry.
    config: {labels: {domain: finance, layer: staging, data_owner: cfo, data_steward: finance-data-steward, classification: sensitive, source_system: payments, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: 7y}}
    columns:
      - name: entry_id
        data_tests: [unique, not_null]

  # ---------------------------------------------------------------- trips and reference
  - name: stg_app_trips
    description: >
      Completed trips (immutable). Trip details are real NYC TLC 2022 trips replayed on the
      simulated date; drivers and riders are synthetic. rider_id is empty for street hails.
    config: {labels: {domain: trips, layer: staging, data_owner: vp-operations, data_steward: ops-data-steward, classification: confidential, source_system: app, data_origin: synthetic, contains_pii: "true", pci_scope: "false", retention: 7y}}
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: driver_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_fleet_drivers'), field: driver_id}}

  - name: stg_tlc_taxi_zones
    description: NYC TLC taxi zones (public reference data), as published, including its duplicate zone IDs (rule REF-01).
    config: {labels: {domain: reference, layer: staging, data_owner: data-governance-manager, data_steward: ops-data-steward, classification: public, source_system: tlc, data_origin: public, contains_pii: "false", pci_scope: "false", retention: indefinite}}
    columns:
      - name: zone_id
        data_tests: [not_null]

  # ---------------------------------------------------------------- marketing
  - name: stg_app_marketing_campaigns
    description: Current version of each marketing campaign.
    config: {labels: {domain: marketing, layer: staging, data_owner: vp-marketing, data_steward: marketing-data-steward, classification: sensitive, source_system: app, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: 3y}}
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]
      - name: target_segment_id
        data_tests:
          - relationships: {arguments: {to: ref('stg_app_rider_segments'), field: segment_id}}

  - name: stg_app_rider_segments
    description: Current version of each rider segment.
    config: {labels: &segments {domain: marketing, layer: staging, data_owner: vp-marketing, data_steward: marketing-data-steward, classification: internal, source_system: app, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: 3y}}
    columns:
      - name: segment_id
        data_tests: [unique, not_null]

  - name: stg_app_rider_segments_history
    description: Every monthly version of each segment's size estimate.
    config: {labels: *segments}

  # ---------------------------------------------------------------- access (IAM)
  - name: stg_iam_access_grants
    description: Current version of each warehouse access grant (who can access which dataset, approved by whom).
    config: {labels: &access {domain: risk, layer: staging, data_owner: ciso, data_steward: risk-data-steward, classification: sensitive, source_system: iam, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: 3y}}
    columns:
      - name: grant_id
        data_tests: [unique, not_null]
      - name: employee_id
        data_tests:
          - relationships: {arguments: {to: ref('stg_hris_employees'), field: employee_id}}

  - name: stg_iam_access_grants_history
    description: Every version of every access grant (requested, approved, expired, revoked), with valid_from / valid_to / is_current.
    config: {labels: *access}

  - name: stg_iam_role_access_tests
    description: Every daily access check of the role service accounts (config and enforcement), as observed.
    config: {labels: {domain: risk, layer: staging, data_owner: ciso, data_steward: risk-data-steward, classification: internal, source_system: bigquery, data_origin: observed, contains_pii: "false", pci_scope: "false", retention: 3y}}

  # ---------------------------------------------------------------- governance
  - name: stg_gov_planted_defects
    description: >
      ANSWER KEY of planted data-quality defects. Only marts/governance/fct_dq_scorecard may
      read it; rules and production models must not.
    config: {labels: {domain: governance, layer: staging, data_owner: data-governance-manager, data_steward: data-governance-manager, classification: internal, source_system: governance, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}}
    columns:
      - name: defect_id
        data_tests: [unique, not_null]
