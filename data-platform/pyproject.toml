[project]
name = "ect-platform"
version = "0.1.0"
description = "Deterministic daily data generator and BigQuery loader for the Empire City Taxi governance sandbox"
readme = "README.md"
authors = [
    { name = "2Wake", email = "328668218+2Wake@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker==37.*",
    "google-cloud-bigquery>=3.30",
]

[project.scripts]
ect-generate = "ect_platform.generate:main"
ect-load = "ect_platform.load:main"
ect-daily = "ect_platform.daily:main"
ect-record = "ect_platform.record:main"
ect-access-check = "ect_platform.access_check:main"
ect-security-review = "ect_platform.security_review:main"
ect-watchdog = "ect_platform.watchdog:main"
ect-ack-summary = "ect_platform.acknowledgments:main"
ect-manifest = "ect_platform.manifest:main"
ect-config-check = "ect_platform.config_check:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
